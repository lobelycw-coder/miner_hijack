services:
  - type: web
    name: miner-scroof
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false